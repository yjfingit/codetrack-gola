# CodeTrack full joint training comparison with epoch-level early stopping.
# This inherits the reference full recipe while using a larger micro-batch on a free GPU.
name: "CodeTrack/DDP smoke"
type: "GOLA"

logging:
  category: "CodeTrack"
  tags: ["DINOv2", "base", "224", "GOLA", "CodeTrack", "full", "full-20-epoch", "ddp-smoke"]

common:
  template_size: [112, 112]
  search_region_size: [224, 224]
  template_feat_size: [8, 8]
  search_region_feat_size: &search_region_feat_size [16, 16]
  response_map_size: *search_region_feat_size
  template_feat_data_layout: "NLC"
  interpolation_mode: "bilinear"
  interpolation_align_corners: false
  normalization: "mm"

model:
  type: "dinov2"
  backbone:
    type: "DINOv2"
    parameters:
      name: "ViT-B/14"
      acc: "default"
  lora:
    r: 64
    alpha: 64
    dropout: 0.1
    use_rslora: false
  num_vpt_tokens: 10
  adapter_reduction_factor: 16
  codetrack: !include "../dinov2/codetrack_final20.yaml"

run:
  type: "default"
  # Long horizon plus external patience monitor: the monitor stops on a sustained
  # plateau and keeps the best epoch, while this cap leaves enough room to converge.
  num_epochs: 1
  efficiency_assessment:
    enabled: false
  checkpoint:
    - type: "regular"
      epoch_trigger:
        interval: 1
        last: true
      resumable: false
      max_to_keep: 1
  task:
    train:
      is_train: true
      data: "train"
      runner: "train"
      logging:
        interval: 1
        local:
          header: "Epoch: [{epoch}]"
          auto_summary: true
  data:
    train:
      global_batch_size: 6
      num_io_threads: 0
      num_workers: 4
      type: "siamese_tracker_train"
      source:
        type: "dataset"
        parameters: !include "../../_dataset/train-lasher-final20-train.yaml"
      sampler:
        type: "random"
        # Short random epochs make the early-stop signal available quickly; the sampler
        # still draws from all 979 LasHeR sequences and the update budget remains large.
        samples_per_epoch: 6
        seed: 42
        weight:
          - match:
              type: "dataset"
              name: "LasHeR"
            value: 1.0
      siamese_training_pair_sampling:
        positive_sample:
          sample_mode: "interval"
          max_gaps: 100
      transform:
        type: "default"
        SiamFC_cropping:
          template:
            area_factor: 2.
          search_region:
            area_factor: 4.
            scale_jitter: 0.25
            translation_jitter: 3
            min_object_size: 10
        online_bbox_shift:
          shift_range_x: [0.5, 1]
          shift_range_y: [0.5, 1]
        augmentation:
          - type: "horizontal_flip"
            target: ["template", "search_region", "online"]
            probability: 0.5
            joint: false
          - type: "color_jitter_mm"
            target: ["template", "search_region", "online"]
            brightness: 0.4
            contrast: 0.4
            saturation: 0.4
            joint: false
          - type: "DeiT_3_aug_mm"
            target: ["template", "search_region", "online"]
            joint: true
        plugin:
          - type: "box_with_score_map_label_generation"
          - type: "template_foreground_indicating_mask_generation"
          - type: "image_corruption"
        visualize: false
  runner:
    train:
      type: "default_train"
      stage:
        name: "SATR-full-early-stop"
        max_updates: 2
        warmup_updates: 64
      optimization:
        optimizer:
          type: "AdamW"
          lr: 5.e-5
          weight_decay: 0.1
          fused: false
          per_parameter:
            - name_regex: 'codetrack\.(motion|memory)\.'
              ndim: 2
              lr: 2.e-5
            - name_regex: 'codetrack\.'
              ndim: 2
              lr: 2.e-5
            - name_regex: 'lora'
              ndim: 2
              lr: 7.e-6
            - name_regex: '^head\.'
              ndim: 2
              lr: 3.e-6
            - name_regex: 'token_type_embed'
              ndim: 2
              lr: 7.e-6
              weight_decay: 0.
            - name_regex: 'codetrack\.memory\.base_prior'
              ndim: 3
              lr: 2.e-5
            - type: "zero_1d_param_weight_decay"
              ndim: [0, 1]
              name_regex: 'codetrack\.'
              lr: 2.e-5
            - type: "zero_1d_param_weight_decay"
              ndim: [0, 1]
              name_regex: '^head\.'
              lr: 3.e-6
            - type: "zero_1d_param_weight_decay"
        grad_accumulation_steps: 4
        max_grad_norm: 1.0
        zero_grad_set_to_none: true
        lr_scheduler:
          type: "timm"
          sched: "cosine"
          per_iteration: true
          override:
            num_epochs: 20
            t_initial_updates: 2
          parameters:
            lr_min: 1.e-6
            warmup_prefix: true
            warmup_updates: 64
            warmup_epochs: 0
            warmup_lr: 1.e-7
        auto_mixed_precision:
          # The paired clean/corrupted forward can overflow the initial fp16 scaler even when
          # the scalar loss is finite. GPU4 has enough headroom for a stable FP32 comparison.
          enabled: false
          dtype: float16
      torch_compile:
        enabled: false
      detect_unused_parameters: false
      criteria:
        type: "codetrack"
        w_track_corr: 1.0
        w_track_clean: 0.25
        lambda_diag: 0.5
        lambda_rec: 0.2
        lambda_gain: 0.2
        lambda_align: 0.2
        lambda_pres: 0.01
        lambda_mem: 0.1
        lambda_gate: 0.1
        lambda_motion: 0.2
        diagnosis_alpha: 0.5
