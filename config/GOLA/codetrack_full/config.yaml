# CodeTrack full training: GOLA-B (pretrained, frozen backbone + trainable LoRA) + CodeTrack
# on the whole LasHeR training set (979 sequences).
#
# Self-contained `run:` block (the upstream run.yaml is not included) because the mixin
# machinery can only *replace existing keys* -- `json_query_replace` skips a key that is not
# already present -- so the `codetrack` criterion cannot be introduced by a mixin.
#
# Batch: 8 x 16 = 128, matching the upstream GOLA recipe.  Measured peak at micro_batch=8 is
# 4.40 GiB of 23.5 GiB, so accumulation is what reaches the upstream batch size without OOM.
name: "CodeTrack/B-224 full"

logging:
  category: "CodeTrack"
  tags: ["DINOv2", "base", "224", "GOLA", "CodeTrack", "full"]

type: "GOLA"

common:
  template_size: [ 112, 112 ]
  search_region_size: [ 224, 224 ]
  template_feat_size: [ 8, 8 ]
  search_region_feat_size: &search_region_feat_size [ 16, 16 ]
  response_map_size: *search_region_feat_size
  template_feat_data_layout: "NLC"
  interpolation_mode: "bilinear"
  interpolation_align_corners: false
  normalization: "mm"

model:
  type: "dinov2"
  backbone:
    type: "DINOv2"
    parameters:
      name: "ViT-B/14"
      acc: "default"
  lora:
    r: 64
    alpha: 64
    dropout: 0.
    use_rslora: false
  num_vpt_tokens: 10
  adapter_reduction_factor: 16
  codetrack: !include "../dinov2/codetrack_b.yaml"

run:
  type: "default"

  num_epochs: 10

  efficiency_assessment:
    enabled: false

  checkpoint:
    - type: "regular"
      epoch_trigger:
        interval: 1
        last: true
      resumable: false
      max_to_keep: 2

  task:
    train:
      is_train: true
      data: "train"
      runner: "train"
      logging:
        interval: 1
        local:
          header: "Epoch: [{epoch}]"

  data:
    train:
      global_batch_size: 8
      num_io_threads: 0
      num_workers: 4
      type: "siamese_tracker_train"
      source:
        type: "dataset"
        parameters: !include "../../_dataset/train-lasher.yaml"
      sampler:
        type: "random"
        samples_per_epoch: 131072
        seed: 42
        weight:
          - match:
              type: "dataset"
              name: "LasHeR"
            value: 1.0
      siamese_training_pair_sampling:
        positive_sample:
          sample_mode: "interval"
          max_gaps: 100
      transform:
        type: "default"
        SiamFC_cropping:
          template:
            area_factor: 2.
          search_region:
            area_factor: 4.
            scale_jitter: 0.25
            translation_jitter: 3
            min_object_size: 10
        online_bbox_shift:
          shift_range_x: [0.5, 1]
          shift_range_y: [0.5, 1]
        augmentation:
          - type: "horizontal_flip"
            target: ["template", "search_region", "online"]
            probability: 0.5
            joint: false
          - type: "color_jitter_mm"
            target: ["template", "search_region", "online"]
            brightness: 0.4
            contrast: 0.4
            saturation: 0.4
            joint: false
          - type: "DeiT_3_aug_mm"
            target: ["template", "search_region", "online"]
            joint: true
        plugin:
          - type: "box_with_score_map_label_generation"
          - type: "template_foreground_indicating_mask_generation"
          # architecture figure block 1: attack the input, not only the tokens
          - type: "image_corruption"
        visualize: false

  runner:
    train:
      type: "default_train"
      optimization:
        optimizer:
          type: "AdamW"
          lr: 1.e-4
          weight_decay: 0.1
          fused: false
          # Grouped learning rates.  The framework applies the FIRST matching rule and only
          # assigns an lr when the rule carries one, so `zero_1d_param_weight_decay` (no lr)
          # stays first and the groups follow.
          #
          # Rationale for the ordering: GOLA is an already-converged checkpoint, so its
          # parameters must move less than the randomly-initialised CodeTrack modules.
          # Measured over 20 steps: LoRA at 2.5e-5 reached loss 2.395 against 4.817 at 1e-4,
          # while neither diverged -- so this is a quality knob, not a stability one.
          # ORDER MATTERS.  Each rule *removes* the parameters it matches from the pool, and
          # `zero_1d_param_weight_decay` carries no `lr` at all.  Leaving it first (as upstream
          # does) therefore pops every bias / norm / gamma out of the pool *before* the groups
          # run, so those tensors end up with no lr of their own and AdamW falls back to its
          # default 1e-3 -- ten times the intended 1e-4.  Measured groups with the grouping
          # rules first and `zero_1d_param_weight_decay` last:
          #   codetrack.motion/memory  18 tensors  lr 1e-4
          #   other codetrack          79 tensors  lr 1e-4
          #   lora                   1152 tensors  lr 2.5e-5
          #   head                     12 tensors  lr 1e-5
          #   token_type_embed          1 tensor   lr 2.5e-5
          # and the remaining 1-d parameters are collected by the final rule with wd=0.
          per_parameter:
            - name_regex: "codetrack\\.(motion|memory)\\."
              lr: 1.e-4
            - name_regex: "codetrack\\.(diagnosis|refiner|denoiser|H|template_pool|template_gate|meanvar|condition_proj)\\."
              lr: 1.e-4
            - name_regex: "lora"
              lr: 2.5e-5
            - name_regex: "^head\\."
              lr: 1.e-5
            - name_regex: "token_type_embed"
              lr: 2.5e-5
            - type: "zero_1d_param_weight_decay"
        grad_accumulation_steps: 16
        max_grad_norm: 1.0
        zero_grad_set_to_none: true
        lr_scheduler:
          type: "timm"
          sched: "cosine"
          per_iteration: true
          parameters:
            lr_min: 1.e-6
            warmup_prefix: true
            warmup_epochs: 2
            warmup_lr: 1.e-7
        auto_mixed_precision:
          enabled: true
          dtype: float16
      torch_compile:
        enabled: false
      detect_unused_parameters: false
      criteria:
        type: "codetrack"
        w_track_corr: 1.0
        w_track_clean: 0.25
        lambda_diag: 0.5
        lambda_rec: 0.2
        lambda_align: 0.2
        lambda_pres: 0.01
        lambda_mem: 0.1
        lambda_gate: 0.1
        lambda_motion: 0.2
        diagnosis_alpha: 0.5
