# CodeTrack full training: GOLA-B (pretrained, frozen backbone + trainable LoRA) + CodeTrack
# on the whole LasHeR training set (979 sequences).
#
# Self-contained `run:` block (the upstream run.yaml is not included) because the mixin
# machinery can only *replace existing keys* -- `json_query_replace` skips a key that is not
# already present -- so the `codetrack` criterion cannot be introduced by a mixin.
#
# Batch: 8 x 16 = 128, matching the upstream GOLA recipe.  Measured peak at micro_batch=8 is
# 4.40 GiB of 23.5 GiB, so accumulation is what reaches the upstream batch size without OOM.
name: "CodeTrack/B-224 full"

logging:
  category: "CodeTrack"
  tags: ["DINOv2", "base", "224", "GOLA", "CodeTrack", "full"]

type: "GOLA"

common:
  template_size: [ 112, 112 ]
  search_region_size: [ 224, 224 ]
  template_feat_size: [ 8, 8 ]
  search_region_feat_size: &search_region_feat_size [ 16, 16 ]
  response_map_size: *search_region_feat_size
  template_feat_data_layout: "NLC"
  interpolation_mode: "bilinear"
  interpolation_align_corners: false
  normalization: "mm"

model:
  type: "dinov2"
  backbone:
    type: "DINOv2"
    parameters:
      name: "ViT-B/14"
      acc: "default"
  lora:
    r: 64
    alpha: 64
    dropout: 0.
    use_rslora: false
  num_vpt_tokens: 10
  adapter_reduction_factor: 16
  codetrack: !include "../dinov2/codetrack_b.yaml"

run:
  type: "default"

  num_epochs: 10

  efficiency_assessment:
    enabled: false

  checkpoint:
    - type: "regular"
      epoch_trigger:
        interval: 1
        last: true
      resumable: false
      max_to_keep: 2

  task:
    train:
      is_train: true
      data: "train"
      runner: "train"
      logging:
        interval: 1
        local:
          header: "Epoch: [{epoch}]"

  data:
    train:
      global_batch_size: 8
      num_io_threads: 0
      num_workers: 4
      type: "siamese_tracker_train"
      source:
        type: "dataset"
        parameters: !include "../../_dataset/train-lasher.yaml"
      sampler:
        type: "random"
        samples_per_epoch: 131072
        seed: 42
        weight:
          - match:
              type: "dataset"
              name: "LasHeR"
            value: 1.0
      siamese_training_pair_sampling:
        positive_sample:
          sample_mode: "interval"
          max_gaps: 100
      transform:
        type: "default"
        SiamFC_cropping:
          template:
            area_factor: 2.
          search_region:
            area_factor: 4.
            scale_jitter: 0.25
            translation_jitter: 3
            min_object_size: 10
        online_bbox_shift:
          shift_range_x: [0.5, 1]
          shift_range_y: [0.5, 1]
        augmentation:
          - type: "horizontal_flip"
            target: ["template", "search_region", "online"]
            probability: 0.5
            joint: false
          - type: "color_jitter_mm"
            target: ["template", "search_region", "online"]
            brightness: 0.4
            contrast: 0.4
            saturation: 0.4
            joint: false
          - type: "DeiT_3_aug_mm"
            target: ["template", "search_region", "online"]
            joint: true
        plugin:
          - type: "box_with_score_map_label_generation"
          - type: "template_foreground_indicating_mask_generation"
          # architecture figure block 1: attack the input, not only the tokens
          - type: "image_corruption"
        visualize: false

  runner:
    train:
      type: "default_train"
      # Stage identity: length is defined in OPTIMIZER UPDATES, not epochs.  The stage
      # ends when ``max_updates`` optimizer steps have been taken, and the cosine
      # horizon below is set to the same number.
      stage:
        name: "S3"
        max_updates: 6000
        warmup_updates: 256
      optimization:
        optimizer:
          type: "AdamW"
          lr: 1.e-4
          weight_decay: 0.1
          fused: false
          # ORDER AND STRUCTURE MATTER.
          #
          # ``zero_1d_param_weight_decay`` is not a filter on LR groups in the sense the other
          # rule types are: it *collects* the parameters that must not be decayed (ndim <= 1, plus
          # every weight inside a norm layer) and assigns ``weight_decay: 0``.  It removes what it
          # matches from the pool, so an unfiltered instance is a catch-all.
          #
          # Two consequences drive this layout:
          #
          # 1. Every tensor (weight-matrix) rule carries an explicit ``ndim: 2``, and every
          #    ``zero_1d`` rule carries ``ndim: [0, 1]``.  Without the dimension scoping the
          #    first ``zero_1d`` rule drains the 1-D and norm parameters of the WHOLE model into
          #    one group -- with CodeTrack enabled that is 59 tensors, so the CodeTrack group
          #    would silently own the head and LoRA biases, and the ``^head\.`` rules below it
          #    would match nothing.  ``_Filter`` really does apply ``name_regex`` and ``ndim``;
          #    the previous revision of this file relied on the opposite.
          # 2. The tensor rules come first, the ``zero_1d`` rules after them, and a bare
          #    ``zero_1d`` catches the remainder.  Each scope therefore gets BOTH its own lr and
          #    weight_decay 0 on its biases/norms -- which is what upstream GOLA wants (it also
          #    zeroes weight decay for ``token_type_embed``).
          #
          # Measured with this layout: 8 groups, all 1406 trainable tensors covered, 0 one-
          # dimensional tensors carrying weight decay, and lr routing
          #   codetrack 2-D 1e-4 | lora 2-D 2.5e-5 | head 2-D 1e-5 | token_type_embed 2.5e-5
          #   codetrack 1-D 1e-4 | head 1-D 1e-5 | remainder (base 1e-4)
          per_parameter:
            - name_regex: 'codetrack\.(motion|memory)\.'
              ndim: 2
              lr: 1.e-4
            - name_regex: 'codetrack\.'
              ndim: 2
              lr: 1.e-4
            - name_regex: 'lora'
              ndim: 2
              lr: 2.5e-5
            - name_regex: '^head\.'
              ndim: 2
              lr: 1.e-5
            - name_regex: 'token_type_embed'
              ndim: 2
              lr: 2.5e-5
              weight_decay: 0.
            - name_regex: 'codetrack\.memory\.base_prior'
              ndim: 3
              lr: 1.e-4
            - type: "zero_1d_param_weight_decay"
              ndim: [ 0, 1 ]
              name_regex: 'codetrack\.'
              lr: 1.e-4
            - type: "zero_1d_param_weight_decay"
              ndim: [ 0, 1 ]
              name_regex: '^head\.'
              lr: 1.e-5
            - type: "zero_1d_param_weight_decay"
        grad_accumulation_steps: 16
        max_grad_norm: 1.0
        zero_grad_set_to_none: true
        lr_scheduler:
          type: "timm"
          sched: "cosine"
          per_iteration: true
          override:
            # The cosine horizon is in OPTIMIZER UPDATES so that it matches
            # ``stage.max_updates`` exactly; deriving it from epochs would make the stage
            # length an approximation of num_epochs x samples_per_epoch.
            num_epochs: 10
            t_initial_updates: 6000
          parameters:
            lr_min: 1.e-6
            warmup_prefix: true
            warmup_updates: 256
            # 0, not the upstream 2.  A 2-epoch warmup belongs to a single-stage 10-epoch run;
            # this config is the reference for the STAGED recipe, where S1 is ~1.5 epochs of
            # updates and would never leave warmup.  Stages set their own warmup by update count
            # in the stage driver (S1 128 / S2 410 / S3 256 / S4 48 updates).
            warmup_epochs: 0
            warmup_lr: 1.e-7
        auto_mixed_precision:
          enabled: true
          dtype: float16
      torch_compile:
        enabled: false
      detect_unused_parameters: false
      criteria:
        type: "codetrack"
        w_track_corr: 1.0
        w_track_clean: 0.25
        lambda_diag: 0.5
        lambda_rec: 0.2
        lambda_gain: 0.2
        lambda_align: 0.2
        lambda_pres: 0.01
        lambda_mem: 0.1
        lambda_gate: 0.1
        lambda_motion: 0.2
        diagnosis_alpha: 0.5
