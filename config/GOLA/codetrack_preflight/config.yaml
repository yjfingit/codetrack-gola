# CodeTrack stage S2 (spatial joint training) and S1 (set GOLA frozen, see below).
#
# TEMPORAL MODULES ARE OFF HERE ON PURPOSE.  The pair sampler draws template / search / online
# frames independently from a track, and the training runner never calls reset_sequence() per
# batch, so with motion/memory enabled the recurrent state would carry sequence A's history into
# sequence K's frame -- fake temporal context.  S1/S2 are therefore purely spatial; the temporal
# branch is switched on in S3, which supplies real consecutive clips.
#
# GOLA-B (pretrained checkpoint, frozen backbone + trainable LoRA) on the whole LasHeR training
# set (979 sequences).
#
# Self-contained `run:` block (the upstream run.yaml is not included) because the mixin
# machinery can only *replace existing keys* -- `json_query_replace` skips a key that is not
# already present -- so the `codetrack` criterion cannot be introduced by a mixin.
#
# Batch: 8 x 16 = 128, matching the upstream GOLA recipe.  Measured peak at micro_batch=8 is
# 4.40 GiB of 23.5 GiB, so accumulation is what reaches the upstream batch size without OOM.
name: "CodeTrack/preflight (300-500 updates)"

logging:
  category: "CodeTrack"
  tags: ["DINOv2", "base", "224", "GOLA", "CodeTrack", "full"]

type: "GOLA"

common:
  template_size: [ 112, 112 ]
  search_region_size: [ 224, 224 ]
  template_feat_size: [ 8, 8 ]
  search_region_feat_size: &search_region_feat_size [ 16, 16 ]
  response_map_size: *search_region_feat_size
  template_feat_data_layout: "NLC"
  interpolation_mode: "bilinear"
  interpolation_align_corners: false
  normalization: "mm"

model:
  type: "dinov2"
  backbone:
    type: "DINOv2"
    parameters:
      name: "ViT-B/14"
      acc: "default"
  lora:
    r: 64
    alpha: 64
    dropout: 0.
    use_rslora: false
  num_vpt_tokens: 10
  adapter_reduction_factor: 16
  codetrack: !include "../dinov2/codetrack_spatial.yaml"

run:
  type: "default"

  num_epochs: 10   # preflight: run ~500 updates then stop by hand

  efficiency_assessment:
    enabled: false

  checkpoint:
    - type: "regular"
      epoch_trigger:
        interval: 1
        last: true
      resumable: false
      max_to_keep: 2

  task:
    train:
      is_train: true
      data: "train"
      runner: "train"
      logging:
        interval: 1
        local:
          header: "Epoch: [{epoch}]"

  data:
    train:
      global_batch_size: 8
      num_io_threads: 0
      num_workers: 4
      type: "siamese_tracker_train"
      source:
        type: "dataset"
        parameters: !include "../../_dataset/train-lasher.yaml"
      sampler:
        type: "random"
        samples_per_epoch: 65536
        seed: 42
        weight:
          - match:
              type: "dataset"
              name: "LasHeR"
            value: 1.0
      siamese_training_pair_sampling:
        positive_sample:
          sample_mode: "interval"
          max_gaps: 100
      transform:
        type: "default"
        SiamFC_cropping:
          template:
            area_factor: 2.
          search_region:
            area_factor: 4.
            scale_jitter: 0.25
            translation_jitter: 3
            min_object_size: 10
        online_bbox_shift:
          shift_range_x: [0.5, 1]
          shift_range_y: [0.5, 1]
        augmentation:
          - type: "horizontal_flip"
            target: ["template", "search_region", "online"]
            probability: 0.5
            joint: false
          - type: "color_jitter_mm"
            target: ["template", "search_region", "online"]
            brightness: 0.4
            contrast: 0.4
            saturation: 0.4
            joint: false
          - type: "DeiT_3_aug_mm"
            target: ["template", "search_region", "online"]
            joint: true
        plugin:
          - type: "box_with_score_map_label_generation"
          - type: "template_foreground_indicating_mask_generation"
          # architecture figure block 1: attack the input, not only the tokens
          - type: "image_corruption"
        visualize: false

  runner:
    train:
      type: "default_train"
      optimization:
        optimizer:
          type: "AdamW"
          lr: 1.e-4
          weight_decay: 0.1
          fused: false
          # ORDER AND STRUCTURE MATTER.
          #
          # ``zero_1d_param_weight_decay`` collects the parameters that must not be decayed
          # (ndim <= 1, plus every weight inside a norm layer) and gives them weight_decay 0.
          # It removes what it matches from the pool, so it must be dimension-scoped: every
          # tensor rule carries ``ndim: 2``, every ``zero_1d`` rule ``ndim: [0, 1]``.  Otherwise
          # the first ``zero_1d`` rule swallows the biases/norms of the whole model (59 tensors
          # once CodeTrack is enabled) and the per-scope rules below it match nothing.
          # See config/GOLA/codetrack_full/config.yaml for the measured group/lr table.
          per_parameter:
            # No motion/memory-specific rule here.  This stage sets ``motion_enabled`` and
            # ``memory_enabled`` to false in dinov2/codetrack_spatial.yaml, so such a rule would
            # match zero parameters and the framework asserts every rule is effective
            # ("rule must be effective").  Nothing is lost: the generic ``codetrack\.`` rule
            # below assigns them 1e-4, which is the same value the full config uses.
            - name_regex: 'codetrack\.'
              ndim: 2
              lr: 1.e-4
            - name_regex: 'lora'
              ndim: 2
              lr: 2.5e-5
            - name_regex: '^head\.'
              ndim: 2
              lr: 1.e-5
            - name_regex: 'token_type_embed'
              ndim: 2
              lr: 2.5e-5
              weight_decay: 0.
            # ``codetrack.memory.base_prior`` (the only 3-D tensor) is absent here: memory is
            # disabled in this stage, so a rule for it would match nothing and trip the
            # framework's "rule must be effective" assert.  It IS explicitly scoped in
            # codetrack_full, where the module exists.
            - type: "zero_1d_param_weight_decay"
              ndim: [ 0, 1 ]
              name_regex: 'codetrack\.'
              lr: 1.e-4
            - type: "zero_1d_param_weight_decay"
              ndim: [ 0, 1 ]
              name_regex: '^head\.'
              lr: 1.e-5
            - type: "zero_1d_param_weight_decay"
        grad_accumulation_steps: 16
        max_grad_norm: 1.0
        zero_grad_set_to_none: true
        # A 2-epoch warmup belongs to a 10-epoch single-stage run.  S1 is ~1.5 epochs total, so
        # it would never leave warmup; stages define their own warmup by update count in the
        # stage driver.  `warmup_prefix: true` with 0 epochs keeps the cosine anchored at step 0.
        lr_scheduler:
          type: "timm"
          sched: "cosine"
          per_iteration: true
          parameters:
            lr_min: 1.e-6
            warmup_prefix: true
            warmup_epochs: 0
            warmup_lr: 1.e-7
        auto_mixed_precision:
          enabled: true
          dtype: float16
      torch_compile:
        enabled: false
      detect_unused_parameters: false
      criteria:
        type: "codetrack"
        w_track_corr: 1.0
        w_track_clean: 0.25
        lambda_diag: 0.5
        lambda_rec: 0.2
        lambda_align: 0.2
        lambda_pres: 0.01
        lambda_mem: 0.1
        lambda_gate: 0.1
        lambda_motion: 0.2
        diagnosis_alpha: 0.5
