# CodeTrack-B: GOLA-B + the CodeTrack branch (architecture figure blocks 3-6).
# Mirrors config/GOLA/dinov2/config.yaml and adds the `codetrack` sub-config; kept as a
# separate file so the upstream GOLA config stays untouched.
name: "CodeTrack/B-224"

logging:
  category: "CodeTrack"
  tags:
    - "DINOv2"
    - "base"
    - "224"
    - "GOLA"
    - "CodeTrack"

type: "GOLA"

common:
  template_size: [ 112, 112 ]
  search_region_size: [ 224, 224 ]
  template_feat_size: [ 8, 8 ]
  search_region_feat_size: &search_region_feat_size [ 16, 16 ]
  response_map_size: *search_region_feat_size
  template_feat_data_layout: "NLC"
  interpolation_mode: "bilinear"
  interpolation_align_corners: false
  normalization: "mm"

model:
  type: "dinov2"
  backbone:
    type: "DINOv2"
    parameters:
      name: "ViT-B/14"
      acc: "default"
  lora:
    r: 64
    alpha: 64
    dropout: 0.
    use_rslora: false
  num_vpt_tokens: 10
  adapter_reduction_factor: 16

  # ---- CodeTrack branch (architecture figure) --------------------------------
  codetrack: !include "codetrack_b.yaml"

run: !include "../run.yaml"
